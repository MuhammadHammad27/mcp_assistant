[project]
name = "mcp-agency-operations"
version = "0.1.0"
description = "A local-first MCP server for agency planning, tasks, proposals, and activity logs."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "mcp[cli]>=2,<3",
  "reportlab>=4,<5",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
